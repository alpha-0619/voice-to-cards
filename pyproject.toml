[project]
name = "voice-to-cards"
version = "0.1.0"
description = "A scenario-agnostic engine that turns one spoken utterance into a structured card, streaming."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repository root, so `tools` is importable. It is deliberately not part of
# the installed package -- it is a bench script and a code generator, not
# something a deployment should carry -- but the tests that check the wire
# names against the generator have to import it. Without this, `pytest` finds
# `core` and `app` from the editable install and nothing else, while
# `python -m pytest` happens to work because that form puts the working
# directory on the path. Two commands, two results, and CI runs the one that
# fails; naming the path here makes both forms agree.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["core*", "app*"]
