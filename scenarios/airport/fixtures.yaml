# Canned tool results. In a live deployment these are what the real integration
# returns; here they stand in for it so the engine can be exercised, demoed and
# tested end to end without any external dependency.
#
# `base` is the shared payload. `localized` overlays only the fields a human
# actually reads, per language -- codes and numbers stay in `base` so routing
# logic never has to care which language it is running in. Adding a language
# means adding an overlay here and a file under strings/, and nothing else.

